<text x="112" y="302.3" fill="#808996" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="end">2x</text>
<line x1="130" y1="210.9" x2="1030" y2="210.9" stroke="#242932" stroke-width="1"/>
<text x="112" y="215.9" fill="#808996" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="end">3x</text>
<line x1="130" y1="124.5" x2="1030" y2="124.5" stroke="#242932" stroke-width="1"/>
<text x="112" y="129.5" fill="#808996" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="end">4x</text>
