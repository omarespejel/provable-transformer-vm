<text x="219.0" y="139.9" fill="#f4f6f8" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">3.73x</text>
<rect x="256" y="124.5" width="38" height="345.5" rx="4" fill="#6fcf97"/>
<text x="275.0" y="116.5" fill="#f4f6f8" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">4.00x</text>
<rect x="312" y="377.0" width="38" height="93.0" rx="4" fill="#f2c94c"/>
<text x="331.0" y="369.0" fill="#f4f6f8" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">1.08x</text>
<rect x="368" y="122.8" width="38" height="347.2" rx="4" fill="#eb5757"/>
<text x="387.0" y="114.8" fill="#f4f6f8" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">4.02x</text>
<text x="303.0" y="512" fill="#f4f6f8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">d64 two head seq32 to seq64</text>
<rect x="594" y="147.9" width="38" height="322.1" rx="4" fill="#2f80ed"/>
<text x="613.0" y="139.9" fill="#f4f6f8" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">3.73x</text>
<rect x="650" y="124.5" width="38" height="345.5" rx="4" fill="#6fcf97"/>
<text x="669.0" y="116.5" fill="#f4f6f8" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">4.00x</text>
<rect x="706" y="376.7" width="38" height="93.3" rx="4" fill="#f2c94c"/>
<text x="725.0" y="368.7" fill="#f4f6f8" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">1.08x</text>
<rect x="762" y="129.9" width="38" height="340.1" rx="4" fill="#eb5757"/>
<text x="781.0" y="121.9" fill="#f4f6f8" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle">3.94x</text>
<text x="697.0" y="512" fill="#f4f6f8" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">d64 four head seq32 to seq64</text>
<rect x="760" y="520" width="14" height="14" rx="3" fill="#2f80ed"/>
<text x="780" y="532" fill="#c8d0d8" font-family="Inter, Arial, sans-serif" font-size="13">lookup</text>
<rect x="860" y="520" width="14" height="14" rx="3" fill="#6fcf97"/>
<text x="880" y="532" fill="#c8d0d8" font-family="Inter, Arial, sans-serif" font-size="13">trace</text>
<rect x="960" y="520" width="14" height="14" rx="3" fill="#f2c94c"/>
<text x="980" y="532" fill="#c8d0d8" font-family="Inter, Arial, sans-serif" font-size="13">fused proof</text>
<rect x="1060" y="520" width="14" height="14" rx="3" fill="#eb5757"/>
<text x="1080" y="532" fill="#c8d0d8" font-family="Inter, Arial, sans-serif" font-size="13">fused prove</text>
<text x="48" y="540" fill="#f4f6f8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700">Reading</text>
<text x="48" y="568" fill="#aab2bd" font-family="Inter, Arial, sans-serif" font-size="15">The size result is real: fused proof bytes grow near 1.08x while lookup and trace work grow about 4x.</text>
<text x="48" y="592" fill="#aab2bd" font-family="Inter, Arial, sans-serif" font-size="15">The speed result is different: local proving time grows near the work axis, so the claim must stay about proof boundaries.</text>
</svg>
